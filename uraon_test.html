<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裏音テスト（ポン版）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #111; color: #fff;
    font-size: 22px; line-height: 1.5;
  }
  h1 { font-size: 30px; margin: 0 0 12px; }
  .note { font-size: 18px; color: #ccc; margin-bottom: 16px; }
  button {
    width: 100%; font-size: 30px; font-weight: bold;
    padding: 22px; border: none; border-radius: 16px;
    background: #2a7de1; color: #fff; margin-bottom: 16px;
  }
  button.stop { background: #555; }
  #judge {
    text-align: center; font-size: 46px; font-weight: bold;
    padding: 28px 8px; border-radius: 20px; margin-bottom: 16px;
    border: 4px solid #444; background: #222;
  }
  #judge.ok { background: #0a6b2b; border-color: #3fdc6f; }
  #judge.ng { background: #222; border-color: #444; color: #aaa; }
  .label { font-size: 22px; margin-bottom: 6px; }
  .meter {
    width: 100%; height: 44px; background: #333;
    border-radius: 10px; overflow: hidden; margin-bottom: 6px;
  }
  .bar { height: 100%; width: 0%; background: #f2b600; transition: width 0.15s; }
  .num { font-size: 40px; font-weight: bold; text-align: right; margin-bottom: 16px; }
  .sub { font-size: 20px; color: #ccc; margin-bottom: 16px; }
  .sens { display: flex; gap: 8px; margin-bottom: 16px; }
  .sens button { font-size: 24px; padding: 14px 4px; margin: 0; background: #444; }
  .sens button.on { background: #2a7de1; }
  .warn { color: #ffcc00; font-size: 20px; }
  canvas { width: 100%; height: 280px; background: #000; border-radius: 10px; display: block; margin-bottom: 6px; }
  .legend { font-size: 18px; color: #ccc; margin-bottom: 16px; }
</style>
</head>
<body>
  <h1>🎤 裏音テスト（ポン版）</h1>
  <div class="note">「目印」入りの曲を流して、スピーカーにスマホを向けてください。</div>

  <button id="startBtn">▶ 聞きはじめる</button>

  <div id="judge" class="ng">× 見つからない</div>

  <div class="label">裏音の強さ</div>
  <div class="meter"><div class="bar" id="bar"></div></div>
  <div class="num" id="num">--</div>
  <div class="sub" id="sub">低い音：-- ／ 高い音：--</div>

  <div class="label">📊 スマホが聞いてる音</div>
  <canvas id="cv"></canvas>
  <div class="legend">赤い線＝目印の音の場所（左1319・右1976）。赤い線のところに<b>とがった山</b>が立てば、目印の音が届いています。<br>白＝今の音 ／ 水色＝直近2秒で一番大きかった音</div>

  <div class="label">感度</div>
  <div class="sens">
    <button data-th="10">高</button>
    <button data-th="15" class="on">中</button>
    <button data-th="20">低</button>
  </div>
  <div class="note">※ 誤ってOKになる時は「低」、なかなかOKにならない時は「高」に。</div>
  <div class="sub" id="ns"></div>
  <div class="warn" id="msg"></div>

<script>
const F1 = 1318.5, F2 = 1975.5;   // 目印の音の高さ（ミとシ）
const WIN = 24;              // 2.4秒分を見る（0.1秒×24）
const PERIOD = 8;            // ポンの間隔 0.8秒（0.1秒×8）
const HOLD = 20;             // OKを2秒は保つ
let threshold = 15;
let ctx, analyser, stream, timer, wakeLock;
let history = [];             // 直近の判定（1回0.1秒）
let isOk = false;
let lastHit = -999, tick = 0;
let hold = null;
const FMIN = 800, FMAX = 2400;

const $ = id => document.getElementById(id);

document.querySelectorAll('.sens button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.sens button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    threshold = Number(b.dataset.th);
  };
});

$('startBtn').onclick = async () => {
  if (ctx) { stop(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    $('msg').textContent = '⚠️ マイクが使えません。マイクの使用を「許可」してください。';
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 4096;
  analyser.smoothingTimeConstant = 0;
  ctx.createMediaStreamSource(stream).connect(analyser);
  try {
    const st = stream.getAudioTracks()[0].getSettings();
    $('ns').textContent = 'スマホのノイズ消し：' + (st.noiseSuppression ? '⚠️ オンのまま' : 'オフ ✅');
  } catch (e) {}
  history = []; tick = 0; lastHit = -999; hold = null;
  timer = setInterval(check, 100);
  $('startBtn').textContent = '■ 止める';
  $('startBtn').classList.add('stop');
  $('msg').textContent = '';
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
};

function stop() {
  clearInterval(timer);
  stream.getTracks().forEach(t => t.stop());
  ctx.close(); ctx = null;
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  $('startBtn').textContent = '▶ 聞きはじめる';
  $('startBtn').classList.remove('stop');
  setJudge(false);
  $('bar').style.width = '0%';
  $('num').textContent = '--';
  $('sub').textContent = '低い音：-- ／ 高い音：--';
}

// その高さの音が、まわりより何dB大きいか
function strength(data, f) {
  const binHz = ctx.sampleRate / analyser.fftSize;
  const c = Math.round(f / binHz);
  let peak = -Infinity;
  for (let i = c - 2; i <= c + 2; i++) peak = Math.max(peak, data[i]);
  const around = [];
  const n1 = Math.round(60 / binHz), n2 = Math.round(300 / binHz);
  for (let i = c - n2; i <= c - n1; i++) around.push(data[i]);
  for (let i = c + n1; i <= c + n2; i++) around.push(data[i]);
  around.sort((a, b) => a - b);
  const floor = around[Math.floor(around.length / 2)];
  return peak - floor;
}

function check() {
  const data = new Float32Array(analyser.frequencyBinCount);
  analyser.getFloatFrequencyData(data);
  const s1 = strength(data, F1), s2 = strength(data, F2);
  const s = Math.min(s1, s2);           // 2つそろって初めて強い
  draw(data);
  history.push(s);
  if (history.length > WIN) history.shift();
  tick++;

  // 表示：ポンが鳴っている時の強さ（強い方の値）
  const sorted = history.slice().sort((a, b) => b - a);
  const show = Math.max(0, sorted[Math.floor(sorted.length * 0.15)]);
  $('bar').style.width = Math.min(100, show / 50 * 100) + '%';
  $('num').textContent = Math.round(show);
  $('sub').textContent = '低い音：' + Math.max(0, Math.round(s1)) + ' ／ 高い音：' + Math.max(0, Math.round(s2));

  // 判定：「ポン、ポン」と0.8秒ごとのリズムで鳴っているか
  if (history.length >= WIN) {
    const h = history.map(v => v >= threshold);
    const frac = h.filter(x => x).length / WIN;
    let edges = 0, same = 0;
    for (let i = 1; i < WIN; i++) if (h[i] && !h[i - 1]) edges++;
    for (let i = PERIOD; i < WIN; i++) if (h[i] === h[i - PERIOD]) same++;
    const rhythm = same / (WIN - PERIOD);
    if (frac >= 0.2 && frac <= 0.6 && edges >= 2 && edges <= 4 && rhythm >= 0.8) lastHit = tick;
  }
  const ok = (tick - lastHit) <= HOLD;
  if (ok !== isOk) setJudge(ok);
}

// グラフを描く
function draw(data) {
  const cv = $('cv');
  const W = cv.width = cv.clientWidth * 2, H = cv.height = cv.clientHeight * 2;
  const g = cv.getContext('2d');
  const binHz = ctx.sampleRate / analyser.fftSize;
  const a = Math.floor(FMIN / binHz), b = Math.ceil(FMAX / binHz);
  const seg = Array.from(data.slice(a, b + 1));
  if (!hold || hold.length !== seg.length) hold = seg.slice();
  for (let i = 0; i < seg.length; i++) hold[i] = Math.max(seg[i], hold[i] - 1.5);
  let hi = Math.max(...hold), lo = Math.min(...seg);
  hi += 3; lo = Math.max(lo, hi - 70);
  const x = f => (f - FMIN) / (FMAX - FMIN) * W;
  const y = v => H - (v - lo) / (hi - lo) * H;
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  [F1, F2].forEach(f => {
    g.strokeStyle = '#ff3b3b'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(x(f), 0); g.lineTo(x(f), H); g.stroke();
  });
  const line = (arr, col, w) => {
    g.strokeStyle = col; g.lineWidth = w; g.beginPath();
    arr.forEach((v, i) => {
      const f = (a + i) * binHz;
      i ? g.lineTo(x(f), y(v)) : g.moveTo(x(f), y(v));
    });
    g.stroke();
  };
  line(hold, '#3fc8ff', 3);
  line(seg, '#ffffff', 3);
  g.fillStyle = '#ccc'; g.font = '28px sans-serif';
  [1000, 1500, 2000].forEach(f => g.fillText(f + 'Hz', x(f) - 40, H - 8));
}

function setJudge(ok) {
  if (ok && !isOk && navigator.vibrate) navigator.vibrate(300);
  isOk = ok;
  $('judge').className = ok ? 'ok' : 'ng';
  $('judge').textContent = ok ? '◎ 聞こえてる！' : '× 見つからない';
}
</script>
</body>
</html>
