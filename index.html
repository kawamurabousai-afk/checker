<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声チェッカー</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: sans-serif;
    background: #fff; color: #111;
    max-width: 480px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  button {
    width: 100%; padding: 18px;
    font-size: 20px; font-weight: bold;
    border: 2px solid #111; border-radius: 12px;
    background: #fff; color: #111;
    margin-bottom: 10px;
  }
  button:disabled { color: #999; border-color: #999; }
  #connectBtn { background: #111; color: #fff; }
  #connectBtn:disabled { background: #fff; }
  .row { display: flex; gap: 10px; }
  .row button { font-size: 16px; padding: 14px 6px; }
  #link { font-size: 16px; margin: 6px 0 8px; }
  #signal { font-size: 18px; margin: 0 0 14px; display: flex; align-items: flex-end; gap: 8px; }
  #bars { display: flex; align-items: flex-end; gap: 4px; height: 30px; }
  #bars span { width: 10px; background: #ccc; border-radius: 2px; }
  #bars span:nth-child(1) { height: 25%; }
  #bars span:nth-child(2) { height: 50%; }
  #bars span:nth-child(3) { height: 75%; }
  #bars span:nth-child(4) { height: 100%; }
  #bars span.on { background: #111; }
  #signal.weak #bars span.on { background: #d00000; }
  #signal.weak #signalText { color: #d00000; font-weight: bold; }
  #state {
    border: 3px solid #999; border-radius: 16px;
    padding: 28px 8px; text-align: center;
    font-size: 48px; font-weight: bold; color: #999;
    margin-bottom: 14px;
  }
  #state.alarm   { border-color: #d00000; color: #d00000; }
  #state.restore { border-color: #007a33; color: #007a33; }
  .note { font-size: 14px; color: #d00000; margin-top: 16px; line-height: 1.6; }

  /* ---- モード切り替え ---- */
  /* フォルダの見出しタブ（押した方が手前に出る） */
  :root { --red: #d00000; --red-pale: #fde3e3; --blue: #0057c2; --blue-pale: #dde9fb; }
  .tabs { display: flex; gap: 6px; align-items: flex-end; padding: 0 6px; position: relative; z-index: 1; }
  .tabs button {
    margin: 0 0 -3px; width: 50%;
    border-width: 3px; border-style: solid; border-radius: 14px 14px 0 0;
    font-size: 17px; padding: 10px 4px 12px;
  }
  #tabHassin { color: var(--red);  border-color: var(--red);  background: var(--red-pale); }
  #tabKanchi { color: var(--blue); border-color: var(--blue); background: var(--blue-pale); }
  .tabs button:not(.on) { padding: 7px 4px 8px; opacity: .75; border-bottom-color: transparent; }
  #tabHassin.on { background: var(--red);  color: #fff; font-size: 19px; }
  #tabKanchi.on { background: var(--blue); color: #fff; font-size: 19px; }
  #panel {
    border: 3px solid var(--red); border-radius: 0 0 16px 16px;
    border-top-width: 8px; padding: 14px 10px 6px; margin-bottom: 8px;
  }
  #panel.kanchi { border-color: var(--blue); }
  #panel #state { margin-bottom: 8px; }
  .sub { margin: 0 0 12px; }
  .sub button { font-size: 16px; padding: 10px 4px; border-color: #0057c2; }

  /* ---- 空気管モード ---- */
  .lbl { font-size: 15px; margin: 4px 0 6px; }
  #serial {
    width: 100%; font-size: 34px; font-weight: bold; text-align: center;
    padding: 10px; border: 2px solid #111; border-radius: 12px;
    letter-spacing: .3em; margin-bottom: 10px;
  }
  #serial:disabled { color: #555; border-color: #999; background: #fff; }
  #jdg button.on { background: #111; color: #fff; }
  #dState {
    border: 3px solid #999; border-radius: 16px;
    padding: 14px 8px; text-align: center; margin-bottom: 12px;
  }
  #dLabel { font-size: 26px; font-weight: bold; color: #999; }
  #dTime  { font-size: 54px; font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1.2; }
  #dSub   { font-size: 16px; color: #333; min-height: 1.4em; }
  #dState.wait    { border-color: #111; }
  #dState.wait #dLabel { color: #111; }
  #dState.alarm   { border-color: #d00000; }
  #dState.alarm #dLabel, #dState.alarm #dTime { color: #d00000; }
  #dState.check   { border-color: #b36b00; }
  #dState.check #dLabel { color: #b36b00; }
  #dState.done    { border-color: #007a33; }
  #dState.done #dLabel { color: #007a33; }
  #startBtn { background: var(--blue); border-color: var(--blue); color: #fff; font-size: 24px; }
  #startBtn:disabled { background: #d6d6d6; border-color: #d6d6d6; color: #888; }
  #jdg button.on { background: var(--blue); border-color: var(--blue); }
  #warn { color: #d00000; font-size: 15px; font-weight: bold; min-height: 1.2em; margin: 0 0 8px; }
  #resetBtn { color: #d00000; border-color: #d00000; font-size: 16px; padding: 12px; margin-top: 18px; }

  table { width: 100%; border-collapse: collapse; font-size: 18px; margin-bottom: 14px; }
  th, td { border-bottom: 1px solid #ccc; padding: 10px 4px; text-align: right; }
  th { font-size: 14px; color: #555; font-weight: normal; border-bottom: 2px solid #111; }
  th:nth-child(2), td:nth-child(2) { text-align: center; }
  td { font-variant-numeric: tabular-nums; }
  #empty { text-align: center; color: #777; padding: 24px 0; }
  #copyMsg { color: #007a33; font-weight: bold; min-height: 1.2em; text-align: center; }
  /* LEDが消えている時の大きなお知らせ（点滅） */
  #ledAlert {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.35); padding: 16px;
    pointer-events: none;   /* 後ろのボタンはそのまま押せる */
  }
  #ledAlert .box {
    width: 100%; max-width: 440px; text-align: center;
    border: 6px solid #d00000; border-radius: 20px; padding: 28px 12px;
    font-weight: bold; animation: blink 1s steps(1, end) infinite;
  }
  #ledAlert .big  { font-size: 40px; line-height: 1.3; }
  #ledAlert .small { font-size: 22px; margin-top: 12px; }
  @keyframes blink {
    0%   { background: #d00000; color: #fff; }
    50%  { background: #fff;    color: #d00000; }
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1>音声チェッカー</h1>

  <button id="connectBtn">① 接続する</button>
  <div class="row">
    <button id="testBtn">🔊 音声テスト</button>
    <button id="disconnectBtn" disabled>切断</button>
  </div>

  <div id="link">状態：未接続</div>
  <div id="signal">
    <span>電波：</span>
    <div id="bars"><span></span><span></span><span></span><span></span></div>
    <span id="signalText">－</span>
  </div>
  <div id="mode" style="font-size:15px; margin:-6px 0 14px; color:#555;">通信：－</div>

  <div class="tabs">
    <button id="tabHassin">発信機モード</button>
    <button id="tabKanchi">空気管モード</button>
  </div>

  <div id="panel">
  <!-- ===== 発信機モード ===== -->
  <section id="viewHassin">
    <div id="state">－－</div>
  </section>

  <!-- ===== 空気管モード ===== -->
  <section id="viewKanchi" class="hidden">
    <div class="row sub">
      <button id="subMeasure">⏱️ 測る</button>
      <button id="subList">📋 一覧（<span id="cnt">0</span>件）</button>
    </div>

    <div id="paneMeasure">
      <div class="lbl">製造番号（下3桁）</div>
      <input id="serial" type="text" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="000">

      <div class="lbl">復旧の判定（点灯が続いたら復旧）</div>
      <div class="row" id="jdg">
        <button data-sec="3">3秒</button>
        <button data-sec="5">5秒</button>
      </div>

      <div id="dState">
        <div id="dLabel">番号を入れてスタート</div>
        <div id="dTime">0</div>
        <div id="dSub"></div>
      </div>

      <div id="warn"></div>
      <button id="startBtn" disabled>▶ スタート</button>
      <button id="stopBtn" class="hidden">■ 中止（記録しない）</button>

      <button id="resetBtn">🗑️ リセット（全部消してNo.1から）</button>
    </div>

    <div id="paneList" class="hidden">
      <table>
        <thead><tr><th>No.</th><th>製造番号</th><th>発報まで</th><th>継続</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty">まだ記録がありません</div>
      <button id="copyBtn">📄 一覧をコピー</button>
      <div id="copyMsg"></div>
    </div>
  </section>

  </div>

  <div id="ledAlert" class="hidden">
    <div class="box">
      <div class="big">⚠️ LEDが<br>消えています</div>
      <div class="small">端子を確認してください</div>
    </div>
  </div>

  <p class="note">
    ⚠️ 使っている間は、この画面を開いたままにしてください。<br>
    ⚠️ Android の Chrome で開いてください。<br>
    ⚠️ スマホの Bluetooth と位置情報を ON にしてください。
  </p>
  <p id="offline" style="font-size:14px; color:#555; margin-top:10px;">圏外対応：準備中…</p>

<script>
const DEVICE_NAME  = "HIKARIBAN_TENKEN_BT";
const SERVICE_UUID = "6f1a0001-9c7d-4f6f-8a7e-000000000001";
const CHAR_UUID    = "6f1a0002-9c7d-4f6f-8a7e-000000000002";

// 電波の強さの区切り（数字が小さいほど弱い）
// 通常モードの区切り（長距離モードの時は、さらに8下げる）
const RSSI_4_BASE = -60;   // これ以上なら4本
const RSSI_3_BASE = -70;   // これ以上なら3本
const RSSI_2_BASE = -80;   // これ以上なら2本、これ未満は1本（弱い）
const WEAK_CLEAR_BASE = -75;   // ここまで回復したら「弱い」解除
const CODED_SHIFT = 8;
const WEAK_REPEAT_MS = 30000;  // 弱いままの時、何ミリ秒ごとに言い直すか

const connectBtn    = document.getElementById("connectBtn");
const disconnectBtn = document.getElementById("disconnectBtn");
const testBtn       = document.getElementById("testBtn");
const linkEl   = document.getElementById("link");
const stateEl  = document.getElementById("state");
const signalEl = document.getElementById("signal");
const signalTextEl = document.getElementById("signalText");
const barEls   = document.querySelectorAll("#bars span");

let device = null;
let manualDisconnect = false;
let wakeLock = null;
let rssiHistory = [];
let isWeak = false;
let lastWeakSpoken = 0;
let currentPhy = 0;
const modeEl = document.getElementById("mode");

// スマホに覚えさせる（電源を切っても残る）
function load(key, def) {
  try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); } catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* 保存できない時はそのまま */ }
}

function setLink(text) { linkEl.textContent = "状態：" + text; }
function isConnected() { return !!(device && device.gatt && device.gatt.connected); }

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = 1.0;
  u.volume = 1.0;
  speechSynthesis.speak(u);
}

function clearSignal() {
  currentPhy = 0;
  if (typeof modeEl !== "undefined" && modeEl) modeEl.textContent = "通信：－";
  rssiHistory = [];
  isWeak = false;
  signalEl.className = "";
  signalTextEl.textContent = "－";
  barEls.forEach(b => b.classList.remove("on"));
}

function updateSignal(rssi) {
  // 直近3回の平均でチラつきをおさえる
  rssiHistory.push(rssi);
  if (rssiHistory.length > 3) rssiHistory.shift();
  const avg = rssiHistory.reduce((a, b) => a + b, 0) / rssiHistory.length;

  const sh = (currentPhy === 3) ? CODED_SHIFT : 0;
  const RSSI_4 = RSSI_4_BASE - sh, RSSI_3 = RSSI_3_BASE - sh, RSSI_2 = RSSI_2_BASE - sh, WEAK_CLEAR = WEAK_CLEAR_BASE - sh;
  let bars = 1;
  if (avg >= RSSI_4) bars = 4;
  else if (avg >= RSSI_3) bars = 3;
  else if (avg >= RSSI_2) bars = 2;

  barEls.forEach((b, i) => b.classList.toggle("on", i < bars));

  if (avg < RSSI_2) isWeak = true;
  else if (avg >= WEAK_CLEAR) isWeak = false;

  if (isWeak) {
    signalEl.className = "weak";
    signalTextEl.textContent = "⚠️ 弱い";
    const now = Date.now();
    if (now - lastWeakSpoken >= WEAK_REPEAT_MS) {
      lastWeakSpoken = now;
      speak("電波が弱いです");
    }
  } else {
    signalEl.className = "";
    signalTextEl.textContent = "";
    lastWeakSpoken = 0;
  }
}

async function keepScreenOn() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) { /* 使えない機種はそのまま */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && isConnected()) keepScreenOn();
});

// =====================================================================
//  モード切り替え
// =====================================================================
let appMode = load("appMode", "hassin");   // "hassin" or "kanchi"
const tabHassin = document.getElementById("tabHassin");
const tabKanchi = document.getElementById("tabKanchi");
const viewHassin = document.getElementById("viewHassin");
const viewKanchi = document.getElementById("viewKanchi");

function setMode(m) {
  if (m === "hassin" && d.phase !== "idle") {
    if (!confirm("測っている途中です。中止して発信機モードにしますか？")) return;
    stopMeasure();
  }
  appMode = m; save("appMode", m);
  tabHassin.classList.toggle("on", m === "hassin");
  tabKanchi.classList.toggle("on", m === "kanchi");
  viewHassin.classList.toggle("hidden", m !== "hassin");
  viewKanchi.classList.toggle("hidden", m !== "kanchi");
  document.getElementById("panel").classList.toggle("kanchi", m === "kanchi");
  if (typeof updateLedAlert === "function") updateLedAlert();
}
tabHassin.addEventListener("click", () => setMode("hassin"));
tabKanchi.addEventListener("click", () => setMode("kanchi"));

// =====================================================================
//  空気管モード（ストップウォッチ）
//    チェッカーのLEDが消える＝「発報」、点く＝「復旧」が届く
//    点灯が「判定秒数」続いたら復旧確定。その間にまた消えたら発報継続
// =====================================================================
const serialEl = document.getElementById("serial");
const startBtn = document.getElementById("startBtn");
const stopBtn  = document.getElementById("stopBtn");
const resetBtn = document.getElementById("resetBtn");
const warnEl   = document.getElementById("warn");
const dStateEl = document.getElementById("dState");
const dLabelEl = document.getElementById("dLabel");
const dTimeEl  = document.getElementById("dTime");
const dSubEl   = document.getElementById("dSub");
const jdgBtns  = document.querySelectorAll("#jdg button");
const tbodyEl  = document.getElementById("tbody");
const emptyEl  = document.getElementById("empty");
const cntEl    = document.getElementById("cnt");

let judgeSec = load("judgeSec", 3);
let records  = load("records", []);   // {no, serial, alarm, dur}
let lastLed  = null;                  // チェッカーから最後に届いた状態 "発報" / "復旧"

// phase: idle（待機） / wait（発報待ち） / alarm（発報中） / check（復旧確認中）
const d = { phase: "idle", serial: "", t0: 0, tAlarm: 0, tRestore: 0, timer: null };
let tick = null;

const sec = (ms) => Math.round(ms / 1000);

function setJudge(s) {
  judgeSec = s; save("judgeSec", s);
  jdgBtns.forEach(b => b.classList.toggle("on", Number(b.dataset.sec) === s));
}
jdgBtns.forEach(b => b.addEventListener("click", () => setJudge(Number(b.dataset.sec))));

function serialOk() { return /^\d{3}$/.test(serialEl.value); }

// LEDが消えている時の大きなお知らせ（空気管モードで、測っていない時だけ）
const ledAlertEl = document.getElementById("ledAlert");
let ledAlertOn = false;   // スタートを押した時にLEDが消えていたら true
function updateLedAlert() {
  if (lastLed !== "発報" || appMode !== "kanchi" || !isConnected()) ledAlertOn = false;
  const show = ledAlertOn && d.phase === "idle";
  ledAlertEl.classList.toggle("hidden", !show);
}

function refreshButtons() {
  updateLedAlert();
  const idle = d.phase === "idle";
  startBtn.classList.toggle("hidden", !idle);
  stopBtn.classList.toggle("hidden", idle);
  serialEl.disabled = !idle;
  jdgBtns.forEach(b => b.disabled = !idle);
  resetBtn.disabled = !idle;
  startBtn.disabled = !(idle && serialOk() && isConnected());
  if (idle) {
    if (!isConnected()) warnEl.textContent = "⚠️ 先に「① 接続する」を押してください";
    else if (serialEl.value && !serialOk()) warnEl.textContent = "⚠️ 製造番号は3桁で入れてください";
    else warnEl.textContent = "";
  }
}

serialEl.addEventListener("input", () => {
  serialEl.value = serialEl.value.replace(/\D/g, "").slice(0, 3);
  refreshButtons();
});

function showState(cls, label, timeMs, sub) {
  dStateEl.className = cls;
  dLabelEl.textContent = label;
  dTimeEl.textContent = timeMs === null ? "－" : sec(timeMs) + "秒";
  dSubEl.textContent = sub || "";
}

function render() {
  const now = Date.now();
  if (d.phase === "wait") {
    showState("wait", "No." + (records.length + 1) + "　" + d.serial + "　発報待ち…", now - d.t0, "スタートからの時間");
  } else if (d.phase === "alarm") {
    showState("alarm", "🔥 発報中", now - d.tAlarm, "発報まで " + sec(d.tAlarm - d.t0) + "秒");
  } else if (d.phase === "check") {
    const left = Math.max(0, Math.ceil((d.tRestore + judgeSec * 1000 - now) / 1000));
    showState("check", "復旧確認中…（あと" + left + "秒）", d.tRestore - d.tAlarm, "発報まで " + sec(d.tAlarm - d.t0) + "秒");
  }
}

// スタートボタン → 「3、2、1、スタート」の声に合わせてから計測開始
const COUNT_STEP_MS = 1000;   // 数字と数字の間（1秒）
let cdTimers = [];

function showCount(n) {
  dStateEl.className = "wait";
  dLabelEl.textContent = "No." + (records.length + 1) + "　" + d.serial + "　用意…";
  dTimeEl.textContent = n;
  dSubEl.textContent = "「スタート」で注入してください";
}

function startCountdown() {
  if (!serialOk() || !isConnected()) return;
  if (lastLed === "発報") {   // LEDが消えている → スタートしないで大きくお知らせ
    ledAlertOn = true; updateLedAlert();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    return;
  }
  d.phase = "count"; d.serial = serialEl.value;
  refreshButtons();
  warnEl.textContent = "";
  if ("speechSynthesis" in window) speechSynthesis.cancel();   // 前の読み上げが残っていたら止める
  [3, 2, 1].forEach((n, i) => {
    cdTimers.push(setTimeout(() => {
      showCount(n); speak(String(n));
      if (navigator.vibrate) navigator.vibrate(60);
    }, i * COUNT_STEP_MS));
  });
  cdTimers.push(setTimeout(startMeasure, 3 * COUNT_STEP_MS));
}

function startMeasure() {
  cdTimers = [];
  d.phase = "wait"; d.t0 = Date.now();   // 「スタート」の瞬間から計測
  speak("スタート");
  if (navigator.vibrate) navigator.vibrate(250);
  tick = setInterval(render, 200);
  render(); refreshButtons();
}

function stopMeasure() {
  cdTimers.forEach(clearTimeout); cdTimers = [];
  clearInterval(tick); tick = null;
  clearTimeout(d.timer); d.timer = null;
  d.phase = "idle";
  showState("", "番号を入れてスタート", null, "");
  refreshButtons();
}

function finishMeasure() {
  // 点灯が判定秒数続いた → 点いた時刻にさかのぼって復旧確定
  const rec = { no: records.length + 1, serial: d.serial, alarm: sec(d.tAlarm - d.t0), dur: sec(d.tRestore - d.tAlarm) };
  records.push(rec); save("records", records);
  clearInterval(tick); tick = null; d.timer = null;
  d.phase = "idle";
  showState("done", "✅ No." + rec.no + "　" + rec.serial + "　記録しました",
            null, "発報まで " + rec.alarm + "秒 ／ 継続 " + rec.dur + "秒");
  dTimeEl.textContent = rec.dur + "秒";
  speak("復旧");
  if (navigator.vibrate) navigator.vibrate(200);
  serialEl.value = "";
  renderList(); refreshButtons();
}

// チェッカーから「発報」「復旧」が届いた時（空気管モード）
function kanchiEvent(kind) {
  const now = Date.now();
  if (d.phase === "wait" && kind === "発報") {
    d.phase = "alarm"; d.tAlarm = now;
    speak("発報");
    if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
  } else if (d.phase === "alarm" && kind === "復旧") {
    d.phase = "check"; d.tRestore = now;
    d.timer = setTimeout(finishMeasure, judgeSec * 1000);
  } else if (d.phase === "check" && kind === "発報") {
    // 判定時間内にまた消えた → 一瞬の点灯なので発報継続
    clearTimeout(d.timer); d.timer = null;
    d.phase = "alarm";
  }
  render();
}

startBtn.addEventListener("click", startCountdown);
stopBtn.addEventListener("click", () => {
  if (confirm("中止しますか？（この回は記録しません）")) stopMeasure();
});
resetBtn.addEventListener("click", () => {
  if (!confirm("本当に全部消しますか？\n（一覧の記録も全部消えて、No.1からになります）")) return;
  records = []; save("records", records);
  serialEl.value = "";
  stopMeasure(); renderList();
});

// ---- 一覧 ----
const subMeasure = document.getElementById("subMeasure");
const subList    = document.getElementById("subList");
const paneMeasure = document.getElementById("paneMeasure");
const paneList    = document.getElementById("paneList");
function setSub(which) {
  paneMeasure.classList.toggle("hidden", which !== "measure");
  paneList.classList.toggle("hidden", which !== "list");
  subMeasure.classList.toggle("on", which === "measure");
  subList.classList.toggle("on", which === "list");
  subMeasure.style.background = which === "measure" ? "#0057c2" : "#fff";
  subMeasure.style.color      = which === "measure" ? "#fff" : "#111";
  subList.style.background    = which === "list" ? "#0057c2" : "#fff";
  subList.style.color         = which === "list" ? "#fff" : "#111";
}
subMeasure.addEventListener("click", () => setSub("measure"));
subList.addEventListener("click", () => setSub("list"));

function renderList() {
  tbodyEl.innerHTML = "";
  records.forEach(r => {
    const tr = document.createElement("tr");
    [r.no, r.serial, r.alarm + "秒", r.dur + "秒"].forEach(v => {
      const td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
    });
    tbodyEl.appendChild(tr);
  });
  emptyEl.classList.toggle("hidden", records.length > 0);
  cntEl.textContent = records.length;
}

function listText() {
  return records.map(r => "No." + r.no + "　" + r.serial + "　発報 " + r.alarm + "秒　継続 " + r.dur + "秒").join("\n");
}
const copyMsg = document.getElementById("copyMsg");
document.getElementById("copyBtn").addEventListener("click", async () => {
  if (!records.length) { copyMsg.textContent = ""; return; }
  const text = listText();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove();
  }
  copyMsg.style.color = ok ? "#007a33" : "#d00000";
  copyMsg.textContent = ok ? "✅ コピーしました。LINEに貼り付けてください" : "⚠️ コピーできませんでした";
  setTimeout(() => copyMsg.textContent = "", 4000);
});

// =====================================================================
//  チェッカーから届いた文字
// =====================================================================
function handleText(text) {
  if (text.startsWith("PHY:")) {
    const phy = parseInt(text.slice(4), 10);
    if (phy === 3 && currentPhy !== 3) speak("長距離モードになりました");
    currentPhy = phy;
    modeEl.textContent = "通信：" + (phy === 3 ? "長距離モード ✅" : phy === 2 ? "高速モード" : "通常モード");
    return;
  }
  if (text.startsWith("RSSI:")) {
    const rssi = parseInt(text.slice(5), 10);
    if (!isNaN(rssi)) updateSignal(rssi);
    return;
  }
  // 今のLEDの状態（チェッカーが定期的に送ってくる。読み上げはしない）
  if (text.startsWith("LED:")) {
    const off = text.slice(4).trim() === "OFF";
    // 測っている途中は「発報」「復旧」の合図だけで判断する
    if (d.phase === "idle") {
      lastLed = off ? "発報" : "復旧";
      if (appMode === "kanchi") refreshButtons(); else updateLedAlert();
      if (!stateEl.className) {   // 発信機モードの表示がまだ「－－」なら今の状態を出す
        stateEl.textContent = off ? "発報" : "復旧";
        stateEl.className = off ? "alarm" : "restore";
      }
    }
    return;
  }
  let kind = null;
  if (text.includes("発報")) kind = "発報";
  else if (text.includes("復旧")) kind = "復旧";
  if (!kind) return;
  lastLed = kind;

  // 発信機モードの表示（いつも更新しておく）
  stateEl.textContent = kind;
  stateEl.className = kind === "発報" ? "alarm" : "restore";

  if (appMode === "kanchi") {
    kanchiEvent(kind);
    if (d.phase === "idle") refreshButtons();
    return;
  }
  if (kind === "発報") {
    if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
    speak("発報");
  } else {
    if (navigator.vibrate) navigator.vibrate(200);
    speak("復旧");
  }
}

function onMessage(event) {
  handleText(new TextDecoder("utf-8").decode(event.target.value));
}

async function openGatt() {
  const server  = await device.gatt.connect();
  const service = await server.getPrimaryService(SERVICE_UUID);
  const ch      = await service.getCharacteristic(CHAR_UUID);
  await ch.startNotifications();
  ch.addEventListener("characteristicvaluechanged", onMessage);
  setLink("接続中 ✅");
  connectBtn.disabled = true;
  disconnectBtn.disabled = false;
  keepScreenOn();
  refreshButtons();
}

async function onDisconnected() {
  disconnectBtn.disabled = true;
  clearSignal();
  lastLed = null;
  refreshButtons();
  if (manualDisconnect) {
    setLink("未接続");
    connectBtn.disabled = false;
    return;
  }
  speak("接続が切れました");
  for (let i = 1; i <= 10; i++) {
    setLink("再接続中…（" + i + "/10）");
    await new Promise(r => setTimeout(r, 2000));
    if (manualDisconnect) break;
    try {
      await openGatt();
      speak("再接続しました");
      return;
    } catch (e) { /* もう一度 */ }
  }
  setLink("未接続（もう一度「接続する」を押してください）");
  connectBtn.disabled = false;
}

connectBtn.addEventListener("click", async () => {
  if (!navigator.bluetooth) {
    alert("このブラウザでは Bluetooth が使えません。\nAndroid の Chrome で開いてください。");
    return;
  }
  try {
    manualDisconnect = false;
    setLink("機器を探しています…");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: DEVICE_NAME }, { services: [SERVICE_UUID] }],
      optionalServices: [SERVICE_UUID]
    });
    device.addEventListener("gattserverdisconnected", onDisconnected);
    setLink("接続しています…");
    await openGatt();
    speak("接続しました");
  } catch (e) {
    setLink("未接続");
    connectBtn.disabled = false;
    if (e.name !== "NotFoundError") alert("接続できませんでした。\n" + e.message);
  }
});

disconnectBtn.addEventListener("click", () => {
  manualDisconnect = true;
  if (isConnected()) device.gatt.disconnect();
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
});

testBtn.addEventListener("click", () => speak("発報"));

// ---- 最初の表示 ----
setJudge(judgeSec === 5 ? 5 : 3);
setSub("measure");
renderList();
stopMeasure();
setMode(appMode === "kanchi" ? "kanchi" : "hassin");

// ---- 圏外でも開けるようにする仕組み ----
const offlineEl = document.getElementById("offline");
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => {
    offlineEl.textContent = "✅ 圏外対応：準備OK（電波がなくても開けます）";
    offlineEl.style.color = "#007a33";
  }).catch(() => {
    offlineEl.textContent = "⚠️ 圏外対応：準備できませんでした（開く時にネットが必要です）";
    offlineEl.style.color = "#d00000";
  });
} else {
  offlineEl.textContent = "⚠️ 圏外対応：このブラウザでは使えません";
  offlineEl.style.color = "#d00000";
}
</script>
