<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>NEWひかり番</title>
<style>
  :root{
    --bg:#111; --panel:#1c1c1c; --off:#2a2a2a; --offText:#8a8a8a;
    --red:#e01b24; --redText:#fff; --gray:#555; --grayText:#bbb; --line:#333;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#eee;
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
  body{display:flex;flex-direction:column;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  h1{font-size:18px;margin:0;letter-spacing:.05em}
  #status{font-size:13px;color:#aaa}
  #grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px;min-height:0}
  .tile{background:var(--off);border:2px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:8px;color:var(--offText);transition:background .15s}
  .name{font-size:clamp(14px,4.4vw,22px);font-weight:700}
  .state{font-size:clamp(18px,6vw,34px);font-weight:800;margin-top:6px}
  .time{font-size:clamp(14px,4.4vw,22px);margin-top:4px;font-variant-numeric:tabular-nums;min-height:1.3em}
  .tile.on{background:var(--red);border-color:#ff6b6b;color:var(--redText);box-shadow:0 0 18px rgba(224,27,36,.6)}
  .tile.on.blink{animation:blink .5s steps(1) infinite}
  @keyframes blink{50%{background:var(--off);color:var(--offText);box-shadow:none}}
  body.lost .tile{background:var(--gray)!important;border-color:#666!important;color:var(--grayText)!important;
    box-shadow:none!important;animation:none!important}
  #lostMsg{display:none;margin-top:10px;text-align:center;font-size:15px;font-weight:700;color:#ffcc66}
  body.lost #lostMsg{display:block}
  header .right{display:flex;align-items:center;gap:10px}
  #resetBtn{font-size:12px;padding:5px 8px;border-radius:6px;border:1px solid #555;background:#222;color:#ccc}
  .tile{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  .name{line-height:1.25;word-break:break-all}
  .name.long{font-size:clamp(12px,3.6vw,18px)}
  .tile.pressing{outline:3px solid #ffcc66}
  .hint{font-size:12px;color:#777;text-align:center;margin-top:6px}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
  #modal.show{display:flex}
  #sheet{background:#1e1e1e;width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  #sheet h2{font-size:18px;margin:0 0 12px}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .list button,.row button,.confirm button{font-size:16px;padding:12px 8px;border-radius:10px;border:1px solid #444;background:#2b2b2b;color:#eee}
  .list button.custom{border-color:#8a6d1d;width:100%}
  .cwrap{position:relative;display:flex}
  .cwrap .del{position:absolute;top:-8px;right:-8px;width:30px;height:30px;padding:0;border-radius:50%;
    border:2px solid #1e1e1e;background:#8a6d1d;color:#fff;font-size:16px;line-height:1;font-weight:700}
  .sub{font-size:13px;color:#999;margin:14px 0 6px}
  .row{display:flex;gap:8px;margin-top:6px}
  .row input{flex:1;min-width:0;font-size:17px;padding:10px;border-radius:10px;border:1px solid #555;background:#222;color:#eee}
  .row button.ok{background:#e01b24;border-color:#e01b24;color:#fff}
  .foot{display:flex;gap:8px;margin-top:14px}
  .foot button{flex:1;font-size:16px;padding:12px;border-radius:10px;border:1px solid #444;background:#2b2b2b;color:#eee}
  .confirm{display:flex;gap:8px;margin-top:12px}
  .confirm button{flex:1}
  .confirm button.danger{background:#e01b24;border-color:#e01b24;color:#fff}
  #setup{display:none;padding:20px;line-height:1.7}
  #setup input{width:100%;font-size:18px;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #555;background:#222;color:#eee}
  #setup button{font-size:18px;padding:10px 20px;border-radius:8px;border:0;background:#e01b24;color:#fff}
</style>
</head>
<body>
<header>
  <h1>NEWひかり番</h1>
  <div class="right"><button id="resetBtn">名前を全部戻す</button><span id="status">接続中…</span></div>
</header>
<div id="grid"></div>
<div class="hint">マスを長押しすると名前を変えられます</div>
<div id="lostMsg">⚠ ESPからの連絡が途切れています（表示は古いかもしれません）</div>

<div id="modal"><div id="sheet"></div></div>

<div id="setup">
  合い言葉を入力してください。<br>
  <input id="keyInput" placeholder="nhb_…" autocapitalize="off" autocomplete="off">
  <button id="keySave">決定</button>
</div>

<script>
(() => {
  const DB = "https://hikariban-cbe8c-default-rtdb.asia-southeast1.firebasedatabase.app";
  const LOST_MS  = 45000;   // 生きてるよ合図がこれだけ来なければ灰色
  const BLINK_MS = 10000;   // 発報直後に点滅する時間
  const N = 6;

  // 合い言葉：URLの # のあと → 端末に覚えておく
  let key = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
  try {
    if (key) localStorage.setItem("nhbKey", key);
    else key = localStorage.getItem("nhbKey") || "";
  } catch (e) {}

  const grid = document.getElementById("grid");
  const statusEl = document.getElementById("status");

  if (!/^nhb_[a-z0-9]+$/.test(key)) {
    grid.style.display = "none";
    document.getElementById("setup").style.display = "block";
    document.getElementById("keySave").onclick = () => {
      const k = document.getElementById("keyInput").value.trim();
      if (k) { location.hash = k; location.reload(); }
    };
    return;
  }

  // マスを作る
  const tiles = [];
  for (let i = 1; i <= N; i++) {
    const el = document.createElement("div");
    el.className = "tile";
    el.innerHTML = `<div class="name"></div><div class="state">―</div><div class="time"></div>`;
    grid.appendChild(el);
    tiles.push({el, nm: el.querySelector(".name"), st: el.querySelector(".state"), tm: el.querySelector(".time")});
  }

  // ───── 名前（このスマホに覚えておく） ─────
  const PRESETS = ["消火栓ポンプ起動","消火栓ポンプ故障","SPポンプ起動","SPポンプ故障",
    "消火水槽満水","消火水槽減水","補給水槽満水","補給水槽減水",
    "呼水槽満水","呼水槽減水","自家発起動","自家発故障","発信機灯"];
  const defName = i => `センサー${i + 1}`;
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let customs = load("nhbCustom", []);       // 自由に入力した名前（新しい順）

  // 名前はFirebaseの names に保存（マクロドロイドも同じ名前を読む）
  const nameOf = i => (data.names && data.names["s" + (i + 1)]) || defName(i);
  function showNames() {
    tiles.forEach((t, i) => { const n = nameOf(i); if (t.nm.textContent !== n) t.nm.textContent = n;
      t.nm.classList.toggle("long", n.length >= 7); });
  }
  async function saveNames(obj) {
    data.names = Object.assign({}, data.names || {}, obj);   // 先に画面だけ変える
    showNames();
    try {
      const r = await fetch(`${DB}/${key}/names.json`, {method: "PATCH", body: JSON.stringify(obj)});
      if (!r.ok) throw new Error(r.status);
    } catch (e) {
      statusEl.textContent = "⚠ 名前を保存できませんでした";
    }
  }
  function setName(i, n) {
    const v = (n && n.trim()) ? n.trim() : defName(i);
    saveNames({["s" + (i + 1)]: v});
  }
  function allDefaults() { const o = {}; for (let i = 0; i < N; i++) o["s" + (i + 1)] = defName(i); return o; }

  // はじめて開いた時：Firebaseに名前がなければ用意する（前の版でスマホに覚えた名前があれば引き継ぐ）
  let namesChecked = false;
  function checkNames() {
    if (namesChecked) return; namesChecked = true;
    const have = data.names || {};
    const old = load("nhbNames", []);
    const add = {};
    for (let i = 0; i < N; i++) {
      const k = "s" + (i + 1);
      if (!have[k]) add[k] = old[i] || defName(i);
    }
    if (Object.keys(add).length) saveNames(add);
    try { localStorage.removeItem("nhbNames"); } catch (e) {}
  }

  // ───── 下から出る画面 ─────
  const modal = document.getElementById("modal"), sheet = document.getElementById("sheet");
  const esc = t => t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function closeModal() { modal.classList.remove("show"); sheet.innerHTML = ""; }
  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

  function openNamer(i) {
    const list = [...customs, ...PRESETS.filter(p => !customs.includes(p))];
    sheet.innerHTML = `
      <h2>センサー${i + 1} の名前</h2>
      <div class="list">${list.map(n => customs.includes(n)
        ? `<div class="cwrap"><button data-n="${esc(n)}" class="custom">${esc(n)}</button><button class="del" data-d="${esc(n)}" aria-label="削除">×</button></div>`
        : `<button data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div>
      ${customs.length ? '<div class="sub">自分で入れた名前（黄色）は、右上の × で消せます</div>' : ""}
      <div class="sub">自由に入力</div>
      <div class="row"><input id="freeName" maxlength="12" placeholder="例：屋上水槽"><button class="ok" id="freeOk">決定</button></div>
      <div class="foot"><button id="backDef">センサー${i + 1} に戻す</button><button id="cancel">やめる</button></div>`;
    sheet.querySelectorAll(".list button[data-n]").forEach(b => b.onclick = () => { setName(i, b.dataset.n); closeModal(); });
    sheet.querySelectorAll(".list button.del").forEach(b => b.onclick = e => {
      e.stopPropagation();
      customs = customs.filter(c => c !== b.dataset.d);
      save("nhbCustom", customs);
      openNamer(i);                       // 一覧を出し直す
    });
    sheet.querySelector("#freeOk").onclick = () => {
      const v = sheet.querySelector("#freeName").value.trim();
      if (!v) return;
      if (!PRESETS.includes(v)) {
        customs = [v, ...customs.filter(c => c !== v)].slice(0, 10);
        save("nhbCustom", customs);
      }
      setName(i, v); closeModal();
    };
    sheet.querySelector("#backDef").onclick = () => { setName(i, ""); closeModal(); };
    sheet.querySelector("#cancel").onclick = closeModal;
    modal.classList.add("show");
  }

  document.getElementById("resetBtn").onclick = () => {
    sheet.innerHTML = `
      <h2>名前を全部「センサー1〜6」に戻しますか？</h2>
      <div class="confirm"><button class="danger" id="yes">戻す</button><button id="no">やめる</button></div>`;
    sheet.querySelector("#yes").onclick = () => { saveNames(allDefaults()); closeModal(); };
    sheet.querySelector("#no").onclick = closeModal;
    modal.classList.add("show");
  };

  // ───── 長押し（0.6秒） ─────
  tiles.forEach((t, i) => {
    let timer = null, sx = 0, sy = 0;
    const cancel = () => { clearTimeout(timer); timer = null; t.el.classList.remove("pressing"); };
    t.el.addEventListener("pointerdown", e => {
      sx = e.clientX; sy = e.clientY; t.el.classList.add("pressing");
      timer = setTimeout(() => { cancel(); openNamer(i); }, 600);
    });
    t.el.addEventListener("pointermove", e => { if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 15) cancel(); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => t.el.addEventListener(ev, cancel));
    t.el.addEventListener("contextmenu", e => e.preventDefault());
  });

  // 受け取ったデータ
  let data = {};
  let lastHbLocal = 0;     // 合図を受け取った時のこの端末の時刻
  let offset = 0;          // Firebaseの時刻 − この端末の時刻
  let streamOk = false;

  function setPath(path, val) {
    if (path === "/") { data = val || {}; return; }
    const parts = path.split("/").filter(Boolean);
    let o = data;
    for (let j = 0; j < parts.length - 1; j++) {
      if (typeof o[parts[j]] !== "object" || o[parts[j]] === null) o[parts[j]] = {};
      o = o[parts[j]];
    }
    if (val === null) delete o[parts[parts.length - 1]];
    else o[parts[parts.length - 1]] = val;
  }

  function noteHeartbeat() {
    if (typeof data.hb === "number") {
      lastHbLocal = Date.now();
      offset = data.hb - lastHbLocal;
    }
  }

  function fmt(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    if (h) return `${h}時間${m}分${sec}秒`;
    if (m) return `${m}分${sec}秒`;
    return `${sec}秒`;
  }

  function render() {
    showNames();
    const now = Date.now() + offset;
    const lost = !streamOk || !lastHbLocal || (Date.now() - lastHbLocal > LOST_MS);
    document.body.classList.toggle("lost", lost);
    statusEl.textContent = !streamOk ? "サーバーに接続中…" :
      lost ? "🔴 途切れています" : "🟢 接続中";

    for (let i = 0; i < N; i++) {
      const s = data["s" + (i + 1)] || {};
      const t = tiles[i];
      const on = s.on === true;
      t.el.classList.toggle("on", on);
      const since = typeof s.t === "number" ? now - s.t : Infinity;
      t.el.classList.toggle("blink", on && since < BLINK_MS);
      t.st.textContent = on ? "発報中" : "―";
      t.tm.textContent = on && isFinite(since) ? fmt(since) : "";
    }
  }

  // Firebaseの「変わったら教えて」（EventSource）
  let es;
  function connect() {
    if (es) es.close();
    es = new EventSource(`${DB}/${key}.json`);
    es.addEventListener("put", ev => {
      streamOk = true;
      const m = JSON.parse(ev.data);
      setPath(m.path, m.data);
      if (m.path === "/") checkNames();
      noteHeartbeat(); render();
    });
    es.addEventListener("patch", ev => {
      streamOk = true;
      const m = JSON.parse(ev.data);
      const base = m.path === "/" ? "" : m.path;
      for (const k in m.data) setPath(base + "/" + k, m.data[k]);
      noteHeartbeat(); render();
    });
    es.addEventListener("keep-alive", () => { streamOk = true; });
    es.onerror = () => { streamOk = false; render(); };
  }
  connect();

  // 画面が戻ってきたらつなぎ直す
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { connect(); requestWake(); }
  });

  // 画面を消さない（対応している端末だけ）
  let wake = null;
  async function requestWake() {
    try { if ("wakeLock" in navigator && !wake) {
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", () => { wake = null; });
    } } catch (e) {}
  }
  requestWake();
  document.addEventListener("click", requestWake);

  setInterval(render, 500);
  render();
})();
</script>
</body>
</html>
