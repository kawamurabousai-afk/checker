<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>NEWひかり番</title>
<style>
  :root{
    --bg:#111; --panel:#1c1c1c; --off:#2a2a2a; --offText:#8a8a8a;
    --red:#e01b24; --redText:#fff; --gray:#555; --grayText:#bbb; --line:#333;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#eee;
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
  body{display:flex;flex-direction:column;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  h1{font-size:18px;margin:0;letter-spacing:.05em}
  #status{font-size:13px;color:#aaa}
  #grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px;min-height:0}
  .tile{background:var(--off);border:2px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:8px;color:var(--offText);transition:background .15s}
  .name{font-size:clamp(14px,4.2vw,22px);font-weight:700}
  .state{font-size:clamp(18px,6vw,34px);font-weight:800;margin-top:6px}
  .time{font-size:clamp(14px,4.4vw,22px);margin-top:4px;font-variant-numeric:tabular-nums;min-height:1.3em}
  .tile.on{background:var(--red);border-color:#ff6b6b;color:var(--redText);box-shadow:0 0 18px rgba(224,27,36,.6)}
  .tile.on.blink{animation:blink .5s steps(1) infinite}
  @keyframes blink{50%{background:var(--off);color:var(--offText);box-shadow:none}}
  body.lost .tile{background:var(--gray)!important;border-color:#666!important;color:var(--grayText)!important;
    box-shadow:none!important;animation:none!important}
  #lostMsg{display:none;margin-top:10px;text-align:center;font-size:15px;font-weight:700;color:#ffcc66}
  body.lost #lostMsg{display:block}
  #setup{display:none;padding:20px;line-height:1.7}
  #setup input{width:100%;font-size:18px;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #555;background:#222;color:#eee}
  #setup button{font-size:18px;padding:10px 20px;border-radius:8px;border:0;background:#e01b24;color:#fff}
</style>
</head>
<body>
<header>
  <h1>NEWひかり番</h1>
  <span id="status">接続中…</span>
</header>
<div id="grid"></div>
<div id="lostMsg">⚠ ESPからの連絡が途切れています（表示は古いかもしれません）</div>

<div id="setup">
  合い言葉を入力してください。<br>
  <input id="keyInput" placeholder="nhb_…" autocapitalize="off" autocomplete="off">
  <button id="keySave">決定</button>
</div>

<script>
(() => {
  const DB = "https://hikariban-cbe8c-default-rtdb.asia-southeast1.firebasedatabase.app";
  const LOST_MS  = 45000;   // 生きてるよ合図がこれだけ来なければ灰色
  const BLINK_MS = 10000;   // 発報直後に点滅する時間
  const N = 6;

  // 合い言葉：URLの # のあと → 端末に覚えておく
  let key = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
  try {
    if (key) localStorage.setItem("nhbKey", key);
    else key = localStorage.getItem("nhbKey") || "";
  } catch (e) {}

  const grid = document.getElementById("grid");
  const statusEl = document.getElementById("status");

  if (!/^nhb_[a-z0-9]+$/.test(key)) {
    grid.style.display = "none";
    document.getElementById("setup").style.display = "block";
    document.getElementById("keySave").onclick = () => {
      const k = document.getElementById("keyInput").value.trim();
      if (k) { location.hash = k; location.reload(); }
    };
    return;
  }

  // マスを作る
  const tiles = [];
  for (let i = 1; i <= N; i++) {
    const el = document.createElement("div");
    el.className = "tile";
    el.innerHTML = `<div class="name">センサー${i}</div><div class="state">―</div><div class="time"></div>`;
    grid.appendChild(el);
    tiles.push({el, st: el.querySelector(".state"), tm: el.querySelector(".time")});
  }

  // 受け取ったデータ
  let data = {};
  let lastHbLocal = 0;     // 合図を受け取った時のこの端末の時刻
  let offset = 0;          // Firebaseの時刻 − この端末の時刻
  let streamOk = false;

  function setPath(path, val) {
    if (path === "/") { data = val || {}; return; }
    const parts = path.split("/").filter(Boolean);
    let o = data;
    for (let j = 0; j < parts.length - 1; j++) {
      if (typeof o[parts[j]] !== "object" || o[parts[j]] === null) o[parts[j]] = {};
      o = o[parts[j]];
    }
    if (val === null) delete o[parts[parts.length - 1]];
    else o[parts[parts.length - 1]] = val;
  }

  function noteHeartbeat() {
    if (typeof data.hb === "number") {
      lastHbLocal = Date.now();
      offset = data.hb - lastHbLocal;
    }
  }

  function fmt(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    if (h) return `${h}時間${m}分${sec}秒`;
    if (m) return `${m}分${sec}秒`;
    return `${sec}秒`;
  }

  function render() {
    const now = Date.now() + offset;
    const lost = !streamOk || !lastHbLocal || (Date.now() - lastHbLocal > LOST_MS);
    document.body.classList.toggle("lost", lost);
    statusEl.textContent = !streamOk ? "サーバーに接続中…" :
      lost ? "🔴 途切れています" : "🟢 接続中";

    for (let i = 0; i < N; i++) {
      const s = data["s" + (i + 1)] || {};
      const t = tiles[i];
      const on = s.on === true;
      t.el.classList.toggle("on", on);
      const since = typeof s.t === "number" ? now - s.t : Infinity;
      t.el.classList.toggle("blink", on && since < BLINK_MS);
      t.st.textContent = on ? "発報中" : "―";
      t.tm.textContent = on && isFinite(since) ? fmt(since) : "";
    }
  }

  // Firebaseの「変わったら教えて」（EventSource）
  let es;
  function connect() {
    if (es) es.close();
    es = new EventSource(`${DB}/${key}.json`);
    es.addEventListener("put", ev => {
      streamOk = true;
      const m = JSON.parse(ev.data);
      setPath(m.path, m.data);
      noteHeartbeat(); render();
    });
    es.addEventListener("patch", ev => {
      streamOk = true;
      const m = JSON.parse(ev.data);
      const base = m.path === "/" ? "" : m.path;
      for (const k in m.data) setPath(base + "/" + k, m.data[k]);
      noteHeartbeat(); render();
    });
    es.addEventListener("keep-alive", () => { streamOk = true; });
    es.onerror = () => { streamOk = false; render(); };
  }
  connect();

  // 画面が戻ってきたらつなぎ直す
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { connect(); requestWake(); }
  });

  // 画面を消さない（対応している端末だけ）
  let wake = null;
  async function requestWake() {
    try { if ("wakeLock" in navigator && !wake) {
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", () => { wake = null; });
    } } catch (e) {}
  }
  requestWake();
  document.addEventListener("click", requestWake);

  setInterval(render, 500);
  render();
})();
</script>
</body>
</html>
